<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6b2f1f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="首尔釜山晚秋">
<title>首尔 · 釜山 晚秋漫游指南｜11.24–11.29</title>
<style>/*LEAFLET_CSS*/</style>
<style>
:root{
  --bg:#f7f1e7; --paper:#fffdf9; --ink:#2f241d; --ink2:#75645a; --line:#ebdfcc;
  --maple:#b4442a; --maple-s:#f6e1d8; --ginkgo:#d49a2a; --ginkgo-s:#fbefd4;
  --pine:#4f6b4a; --pine-s:#e3ebdc; --night:#2d3a55; --night-s:#e1e6f1;
  --rose:#c2577a; --rose-s:#f7e2ea;
  --r:16px; --sh:0 1px 2px rgb(60 40 20/.06),0 4px 16px rgb(60 40 20/.07);
  --tabh:62px; --safe-b:env(safe-area-inset-bottom,0px);
  --sans:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --serif:"Songti SC","Noto Serif SC","Source Han Serif SC",serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.65 var(--sans);-webkit-font-smoothing:antialiased;
  padding-bottom:calc(var(--tabh) + var(--safe-b));overscroll-behavior-y:none}
h1,h2,h3,h4{margin:0;line-height:1.3}
h2{font-family:var(--serif);font-size:1.35rem}
p{margin:.3rem 0}
a{color:var(--maple)}
button{font:inherit;color:inherit}
img{display:block;max-width:100%}

/* ---------- app header ---------- */
.appbar{position:sticky;top:0;z-index:40;background:linear-gradient(120deg,#4a2618,#7a3420 55%,#a6532a);color:#fff7ea;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px}
.appbar .row{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:1100px;margin:0 auto}
.appbar h1{font-family:var(--serif);font-size:1.12rem;letter-spacing:.02em;white-space:nowrap}
.appbar h1 small{font:500 .7rem var(--sans);opacity:.8;margin-left:6px;letter-spacing:.05em}
.count-chip{font-size:.75rem;background:rgb(255 255 255/.16);border:1px solid rgb(255 255 255/.25);padding:3px 10px;border-radius:99px;white-space:nowrap}

/* ---------- views ---------- */
.view{display:none;max-width:1100px;margin:0 auto;padding:0 0 24px}
.view.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:.4}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.view.on{animation:none}}
.pad{padding:0 14px}
.sec-title{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:20px 14px 10px}
.sec-title .sub{font-size:.8rem;color:var(--ink2)}

/* ---------- bottom tab bar ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgb(255 253 249/.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
.tabbar ul{list-style:none;margin:0 auto;padding:0;display:grid;grid-template-columns:repeat(5,1fr);max-width:640px;height:var(--tabh)}
.tabbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;height:100%;text-decoration:none;color:var(--ink2);font-size:.7rem}
.tabbar a .ic{font-size:1.3rem;line-height:1;filter:grayscale(.85);opacity:.75;transition:transform .15s}
.tabbar a[aria-current="page"]{color:var(--maple);font-weight:700}
.tabbar a[aria-current="page"] .ic{filter:none;opacity:1;transform:translateY(-1px) scale(1.1)}

/* ---------- chips / segmented ---------- */
.chiprow{display:flex;gap:8px;overflow-x:auto;padding:10px 14px;scrollbar-width:none;scroll-snap-type:x proximity}
.chiprow::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;scroll-snap-align:start;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:6px 12px;cursor:pointer;text-align:center;line-height:1.25}
.chip b{display:block;font-size:.92rem}
.chip span{font-size:.7rem;color:var(--ink2)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.chip[aria-pressed="true"] span{color:#e9dccb}
.chip.sm{padding:5px 12px;border-radius:99px;font-size:.84rem}
.stickybar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 48px);z-index:30;background:rgb(247 241 231/.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.seg{display:flex;background:#ece2d2;border-radius:12px;padding:3px;margin:12px 14px 4px;gap:2px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:7px 4px;font-size:.88rem;cursor:pointer;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgb(0 0 0/.1)}

/* ---------- generic card ---------- */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.tag{display:inline-block;font-size:.68rem;padding:1px 8px;border-radius:99px;font-weight:600;margin:2px 4px 0 0;white-space:nowrap}
.t-autumn{background:var(--maple-s);color:var(--maple)} .t-shop{background:var(--rose-s);color:var(--rose)}
.t-food{background:var(--ginkgo-s);color:#8a5f0d} .t-night{background:var(--night-s);color:var(--night)}
.t-move{background:var(--pine-s);color:var(--pine)} .t-culture{background:#efe6f6;color:#6a4a8a}
.t-ns{background:#fde7d6;color:#a3501c}
.lnk{display:inline-flex;align-items:center;gap:3px;font-size:.74rem;text-decoration:none;padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--pine);background:#fff;white-space:nowrap;cursor:pointer}
.lnk:active{background:var(--pine-s)}
.muted{color:var(--ink2)} .small{font-size:.84rem}
.noimg{display:flex;align-items:center;justify-content:center;font-size:2rem;background:linear-gradient(135deg,var(--ginkgo-s),var(--maple-s))}

/* ---------- day view ---------- */
.day-cover{position:relative;margin:12px 14px 0;border-radius:20px;overflow:hidden;aspect-ratio:16/9;background:#3a2419;box-shadow:var(--sh)}
.day-cover img,.day-cover .noimg{width:100%;height:100%;object-fit:cover}
.day-cover .ov{position:absolute;inset:auto 0 0 0;padding:40px 16px 14px;background:linear-gradient(transparent,rgb(20 10 5/.82));color:#fff}
.day-cover .ov .k{font-size:.72rem;letter-spacing:.12em;opacity:.9}
.day-cover .ov h2{color:#fff;font-size:1.3rem;margin-top:2px}
.day-cover .ov .area{font-size:.8rem;opacity:.92;margin-top:4px}
.day-cover .badge{position:absolute;top:12px;left:12px;background:var(--maple);color:#fff;border-radius:10px;padding:4px 10px;font-size:.78rem;font-weight:700}
.day-cover .badge.bs{background:var(--night)}
.daygrid{display:block}
.mapbox{margin:12px 14px 0;border-radius:16px;overflow:hidden;border:1px solid var(--line);position:relative;background:#e8e2d6}
#dayMap{height:230px}
.mapbox .expand{position:absolute;right:8px;bottom:8px;z-index:500;background:#fff;border:1px solid var(--line);border-radius:10px;padding:5px 10px;font-size:.78rem;cursor:pointer;box-shadow:var(--sh)}
.infobar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 14px 0}
.infobar .card{padding:10px 12px;font-size:.8rem;line-height:1.45}
.infobar .card b{display:block;font-size:.88rem;margin-bottom:2px}
.tl{list-style:none;margin:12px 14px 0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:15px;top:8px;bottom:8px;border-left:2px dashed #e0cfb5}
.tl>li{position:relative;padding-left:40px;margin-bottom:12px}
.tl .num{position:absolute;left:3px;top:12px;width:26px;height:26px;border-radius:50%;background:var(--dc,var(--maple));color:#fff;font-size:.78rem;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px var(--bg)}
.tl .num.mv{background:var(--pine)}
.item{display:flex;gap:12px;padding:10px;align-items:flex-start}
.item .th{flex:0 0 92px;height:92px;border-radius:12px;overflow:hidden;cursor:zoom-in;background:#eee}
.item .th img,.item .th .noimg{width:100%;height:100%;object-fit:cover;font-size:1.6rem}
.item .bd{flex:1;min-width:0}
.item time{font-size:.74rem;font-weight:700;color:var(--ink2);font-variant-numeric:tabular-nums}
.item h4{font-size:.98rem;margin:1px 0 2px}
.item p{font-size:.84rem;color:var(--ink2);margin:2px 0 4px}
.item .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.note{margin:4px 14px 10px;font-size:.84rem;padding:10px 12px;border-radius:12px;line-height:1.55}
.note.tip{background:#fbf3df;color:#6b5320;border:1px solid #f0dfb5}
.note.alt{background:var(--night-s);color:var(--night);border:1px solid #cbd3e6}
.daynav{display:flex;justify-content:space-between;gap:10px;margin:14px}
.daynav button{flex:1;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:10px;cursor:pointer;font-size:.86rem}
.daynav button:disabled{opacity:.35}
.swipehint{text-align:center;font-size:.72rem;color:var(--ink2);margin-top:-4px}
@media (min-width:960px){
  .daygrid{display:grid;grid-template-columns:1fr 420px;gap:0 6px;align-items:start}
  .daygrid .side{position:sticky;top:120px}
  #dayMap{height:440px}
  .swipehint{display:none}
}

/* ---------- map view ---------- */
#bigMap{height:calc(100vh - 210px);height:calc(100dvh - 210px - var(--safe-b));min-height:320px}
.legend{display:flex;flex-wrap:wrap;gap:8px 12px;font-size:.74rem;color:var(--ink2);padding:8px 14px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.zone-card{padding:14px;margin:0 14px 12px}
.zone-card h3{font-size:1rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.zone-card .rec{font-size:.68rem;background:var(--maple);color:#fff;padding:1px 8px;border-radius:99px}
.zone-card .rec.b{background:#a39282}
.zone-card ul{margin:6px 0 8px;padding-left:1.1em;font-size:.84rem}
.zone-card li{margin:1px 0}
.pros{color:var(--pine)} .cons{color:#a0522d}
.mk{display:flex;align-items:center;justify-content:center;border-radius:50%;color:#fff;font-weight:700;font-size:12px;border:2px solid #fff;box-shadow:0 1px 4px rgb(0 0 0/.35)}
.mk-food{background:#fff;color:#000;font-size:15px;border:2px solid var(--ginkgo)}
.zone-label{background:rgb(255 255 255/.92);border:1px solid var(--line);border-radius:8px;padding:2px 7px;font-size:11px;font-weight:700;white-space:nowrap;color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0/.15)}
.leaflet-popup-content{margin:10px 12px;font:13px/1.5 var(--sans)}
.pop h4{font-size:14px;margin-bottom:2px}
.pop .ko{color:var(--ink2);font-size:12px}
.pop img{width:220px;height:124px;object-fit:cover;border-radius:8px;margin:6px 0}
.pop .acts{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.mapnote{font-size:.74rem;color:var(--ink2);padding:6px 14px 0}

/* ---------- discover ---------- */
.pgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:0 14px}
@media (min-width:640px){.pgrid{grid-template-columns:repeat(3,1fr)}}
@media (min-width:960px){.pgrid{grid-template-columns:repeat(4,1fr)}}
.pcard{overflow:hidden;display:flex;flex-direction:column}
.pcard .ph{aspect-ratio:4/3;overflow:hidden;cursor:zoom-in;background:#eee}
.pcard .ph img,.pcard .ph .noimg{width:100%;height:100%;object-fit:cover}
.pcard .bd{padding:9px 10px 10px;display:flex;flex-direction:column;gap:2px;flex:1}
.pcard h3{font-size:.92rem}
.pcard p{font-size:.78rem;color:var(--ink2);margin:1px 0 4px;line-height:1.5}
.pcard .stars{color:var(--ginkgo);font-size:.78rem;letter-spacing:1px}
.pcard .meta{display:flex;justify-content:space-between;align-items:center;gap:4px;margin-top:auto;padding-top:4px}
.city{font-size:.64rem;padding:1px 7px;border-radius:6px;background:var(--maple-s);color:var(--maple);font-weight:700;white-space:nowrap}
.city.bs{background:var(--night-s);color:var(--night)}
.wide{grid-column:1/-1}
.dist{padding:12px 14px}
.dist dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:6px 0 0;font-size:.82rem}
.dist dt{color:var(--ink2)} .dist dd{margin:0}
.banner{margin:12px 14px;padding:12px 14px;border-radius:14px;background:#fff4ec;border:1px solid #f0c9ad;font-size:.84rem;line-height:1.6}
.banner b:first-child{display:block;margin-bottom:2px}

/* ---------- food ---------- */
.rlist{padding:0 14px;display:grid;gap:10px}
@media (min-width:760px){.rlist{grid-template-columns:1fr 1fr}}
.rcard{padding:12px 14px;display:flex;gap:12px;align-items:flex-start}
.rcard .th{flex:0 0 70px;height:70px;border-radius:10px;overflow:hidden}
.rcard .th img,.rcard .th .noimg{width:100%;height:100%;object-fit:cover;font-size:1.4rem}
.rcard h4{font-size:.95rem}
.rcard p{font-size:.8rem;color:var(--ink2);margin:2px 0}
.how{display:inline-block;font-size:.68rem;font-weight:700;padding:1px 8px;border-radius:99px;margin-top:2px}
.how.walk{background:var(--pine-s);color:var(--pine)} .how.wait{background:var(--ginkgo-s);color:#8a5f0d} .how.book{background:var(--maple-s);color:var(--maple)}

/* ---------- prep ---------- */
details.acc{margin:0 14px 10px;background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);overflow:hidden}
details.acc summary{list-style:none;cursor:pointer;padding:13px 14px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:8px}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary::after{content:"＋";color:var(--ink2);font-weight:400}
details.acc[open] summary::after{content:"－"}
details.acc .in{padding:0 14px 14px;font-size:.86rem}
details.acc ul{padding-left:1.1em;margin:4px 0}
.ok{display:inline-block;background:var(--pine);color:#fff;font-size:.7rem;padding:1px 8px;border-radius:99px;margin-left:6px;font-weight:600}
.checklist{list-style:none;padding:0;margin:0}
.checklist li{border-bottom:1px dashed var(--line)}
.checklist label{display:flex;gap:10px;align-items:center;padding:8px 0;cursor:pointer}
.checklist input{width:20px;height:20px;accent-color:var(--maple);flex:0 0 auto;margin:0}
.checklist input:checked+span{text-decoration:line-through;color:var(--ink2)}
.meter{height:8px;background:#efe5d4;border-radius:99px;overflow:hidden;flex:1}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--ginkgo),var(--maple));border-radius:99px;transition:width .2s}
.prog{display:flex;align-items:center;gap:10px;margin:6px 0 4px}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:5px 12px;cursor:pointer;font-size:.8rem}
table{border-collapse:collapse;width:100%;font-size:.82rem}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
td.n{white-space:nowrap;font-variant-numeric:tabular-nums;text-align:right}
tfoot td{font-weight:700}
.credits{font-size:.7rem;color:var(--ink2);line-height:1.5;max-height:260px;overflow:auto}
.credits li{margin:2px 0}

/* ---------- lightbox ---------- */
dialog.lb{padding:0;border:0;background:transparent;max-width:100vw;max-height:100vh;width:100vw;height:100vh;margin:0}
dialog.lb::backdrop{background:rgb(10 6 4/.88)}
dialog.lb .wrap{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:10px}
dialog.lb img{max-width:100%;max-height:78vh;border-radius:10px;object-fit:contain}
dialog.lb .cap{color:#f4e9da;font-size:.85rem;text-align:center;max-width:600px}
dialog.lb .x{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);right:14px;width:40px;height:40px;border-radius:50%;border:0;background:rgb(255 255 255/.15);color:#fff;font-size:1.3rem;cursor:pointer}
/* ---------- falling leaves (decorative, in side gutters, disappears at bottom 1/3) ---------- */
.leaves-box{position:fixed;inset:0;pointer-events:none;z-index:90;overflow:hidden;-webkit-mask-image:linear-gradient(to bottom,#000 0%,#000 56%,rgba(0,0,0,.4) 64%,transparent 68%);mask-image:linear-gradient(to bottom,#000 0%,#000 56%,rgba(0,0,0,.4) 64%,transparent 68%)}
.leaves-side{position:absolute;top:0;bottom:0;width:calc((100vw - 1100px) / 2);min-width:32px;max-width:220px}
.leaves-left{left:0}
.leaves-right{right:0}
.leaf{position:absolute;top:-45px;user-select:none;pointer-events:none;opacity:.85;animation:fall linear infinite;will-change:transform}
@keyframes fall{
  0%{transform:translate(0,-45px) rotate(0deg);opacity:0}
  10%{opacity:.85}
  50%{transform:translate(var(--sway,20px),36vh) rotate(180deg);opacity:.85}
  75%{transform:translate(calc(var(--sway,20px) * 0.4),54vh) rotate(260deg);opacity:.8}
  92%{opacity:.2}
  100%{transform:translate(var(--sway-end,-12px),72vh) rotate(340deg);opacity:0}
}
@media (prefers-reduced-motion:reduce){.leaf{animation:none;display:none}}
@media print{.leaves-box{display:none!important}}

:focus-visible{outline:2px solid var(--maple);outline-offset:2px}
</style>
</head>
<body>

<div class="leaves-box" aria-hidden="true">
  <div class="leaves-side leaves-left" id="leavesLeft"></div>
  <div class="leaves-side leaves-right" id="leavesRight"></div>
</div>

<header class="appbar">
  <div class="row">
    <h1>🍁 首尔 · 釜山 晚秋<small>11.24 – 11.29 · 2人</small></h1>
    <span class="count-chip" id="countChip"></span>
  </div>
</header>

<!-- ============ 行程 ============ -->
<main>
<section class="view" id="v-days" aria-label="每日行程">
  <div class="stickybar"><div class="chiprow" id="dayChips" role="group" aria-label="选择日期"></div></div>
  <div id="dayPanel"></div>
</section>

<!-- ============ 地图 ============ -->
<section class="view" id="v-map" aria-label="地图">
  <div class="stickybar">
    <div class="seg" id="citySeg" role="group" aria-label="城市">
      <button type="button" data-city="seoul" aria-pressed="true">首尔</button>
      <button type="button" data-city="busan" aria-pressed="false">釜山</button>
    </div>
    <div class="chiprow" id="mapChips" role="group" aria-label="图层" style="padding-top:6px"></div>
  </div>
  <div id="bigMap" role="region" aria-label="地图"></div>
  <div class="legend" id="legend"></div>
  <p class="mapnote">📍 标记为大致位置，点开后用「Naver / Kakao」按钮跳转精确导航。底图需联网加载。</p>
  <div class="sec-title"><h2>🏨 住哪里</h2><span class="sub">地图上的彩色圆圈</span></div>
  <div id="zoneList"></div>
</section>

<!-- ============ 发现 ============ -->
<section class="view" id="v-discover" aria-label="发现">
  <div class="stickybar">
    <div class="seg" id="discSeg" role="group" aria-label="分类">
      <button type="button" data-k="autumn" aria-pressed="true">🍁 秋景</button>
      <button type="button" data-k="shop" aria-pressed="false">🛍 街区</button>
      <button type="button" data-k="ns" aria-pressed="false">✨ 非标</button>
      <button type="button" data-k="xmas" aria-pressed="false">🎄 圣诞</button>
    </div>
    <div class="chiprow" id="discChips" role="group" aria-label="筛选" style="padding-top:6px"></div>
  </div>
  <div id="discPanel"></div>
</section>

<!-- ============ 美食 ============ -->
<section class="view" id="v-food" aria-label="美食">
  <div class="sec-title"><h2>📒 订位 / 排队清单</h2><span class="sub">按日期排</span></div>
  <div class="banner"><b>怎么订？</b>韩国热门店多用 <b>Catch Table</b>（캐치테이블）线上订位或远程排队，有英文界面；没有订位的店就是现场排队，饭点前 30 分钟到最稳。很多店<b>不接一人份</b>，两个人点两份主食起。</div>
  <div class="rlist" id="restoList"></div>
  <div class="sec-title"><h2>😋 必吃清单</h2></div>
  <div class="pgrid" id="dishGrid"></div>
</section>

<!-- ============ 准备 ============ -->
<section class="view" id="v-prep" aria-label="出行准备">
  <div class="sec-title"><h2>🧳 出行准备</h2></div>
  <div id="prepPanel"></div>
</section>
</main>

<nav class="tabbar" aria-label="主导航">
  <ul>

/* ================= ROUTER ================= */
const VIEWS = ['days','map','discover','food','prep'];
let curDay = 'd1';
function route(){
  const h = location.hash.slice(1);
  let [v, arg] = h.split('/');
  if (!VIEWS.includes(v)) v = 'days';
  $$('.view').forEach(s => s.classList.toggle('on', s.id === 'v-' + v));
  $$('.tabbar a').forEach(a => { if (a.dataset.v === v) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
  if (v === 'days'){ if (arg && dayOf(arg)) curDay = arg; renderDay(curDay); }
  else if (v === 'map'){ initBigMap(); if (arg) mapFocus(arg); setTimeout(() => bigMap && bigMap.invalidateSize(), 60); }
  else if (v === 'discover'){ renderDisc(); }
  else if (v === 'food'){ renderFood(); }
  else if (v === 'prep'){ renderPrep(); }
  window.scrollTo(0, 0);
}
addEventListener('hashchange', route);

/* ================= COUNTDOWN ================= */
(function(){
  const start = new Date('2026-11-24T00:00:00+09:00'), end = new Date('2026-11-30T00:00:00+09:00');
  const now = new Date(), chip = $('#countChip');
  if (now < start){ chip.textContent = '还有 ' + Math.ceil((start - now) / 864e5) + ' 天出发'; }
  else if (now < end){
    const idx = Math.floor((now - start) / 864e5);
    chip.textContent = '旅途中 · D' + (idx + 1);
    curDay = 'd' + (idx + 1);
  } else chip.textContent = '旅途愉快 ✨';
})();

/* ================= FALLING LEAVES (SIDE GUTTERS) ================= */
(function(){
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const leftBox = document.getElementById('leavesLeft');
  const rightBox = document.getElementById('leavesRight');
  if (!leftBox || !rightBox) return;
  const glyphs = ['🍁','🍂','🍁','🍂','💛'];
  const count = 16;
  for (let i = 0; i < count; i++){
    const box = (i % 2 === 0) ? leftBox : rightBox;
    const s = document.createElement('span');
    s.className = 'leaf';
    s.textContent = glyphs[i % glyphs.length];
    s.style.left = (Math.random() * 80 + 5) + '%';
    s.style.fontSize = (14 + Math.random() * 14) + 'px';
    const sway = (Math.random() * 24 + 10) * (i % 2 === 0 ? 1 : -1);
    const swayEnd = (Math.random() * 20 - 10);
    s.style.setProperty('--sway', sway + 'px');
    s.style.setProperty('--sway-end', swayEnd + 'px');
    s.style.animationDuration = (9 + Math.random() * 10) + 's';
    s.style.animationDelay = (-Math.random() * 19) + 's';
    box.appendChild(s);
  }
})();

function numIcon(num, color, size=24){
  return L.divIcon({className:'', html:`<div class="mk" style="width:${size}px;height:${size}px;background:${color}">${num}</div>`, iconSize:[size,size], iconAnchor:[size/2,size/2], popupAnchor:[0,-size/2]});
}
const foodIcon = L.divIcon({className:'', html:'<div class="mk mk-food" style="width:28px;height:28px">🍜</div>', iconSize:[28,28], iconAnchor:[14,14], popupAnchor:[0,-14]});
function tiles(map){
  const layer = L.tileLayer('https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png', {
    maxZoom: 19, subdomains: ['a', 'b', 'c'],
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  });
  layer.on('tileerror', function(e) {
    if (e && e.tile && !e.tile._fb) {
      e.tile._fb = true;
      const c = e.coords;
      if (c) {
        e.tile.src = `https://tile.openstreetmap.org/${c.z}/${c.x}/${c.y}.png`;
      }
    }
  });
  layer.addTo(map);
}
function popHTML(pid){
  const p = PL[pid]; const ds = placeDays(pid);
  return `<div class="pop"><h4>${p.n}</h4><div class="ko">${p.ko}${ds.length ? ' · ' + ds.join(' / ') : ''}</div>${src(p.img) ? `<img src="${src(p.img)}" alt="">` : ''}<div class="acts">${links(p)}</div></div>`;
}
function zonePop(z){
  return `<div class="pop"><h4>🏨 ${z.name}（${z.rec}）</h4><div class="ko">${z.nights}</div><p style="margin:4px 0">${z.tip}</p><div class="acts"><a class="lnk" href="${naver(z.q)}" target="_blank" rel="noopener">在 Naver 搜酒店</a></div></div>`;
}
function drawDayMap(d){
  if (!window.L) return;
  const container = document.getElementById('dayMap');
  if (!container) return;
  if (dayMap){
    try { dayMap.remove(); } catch(e){}
    dayMap = null;
  }
  container._leaflet_id = null;

  const defaultCenter = d.city === 'seoul' ? [37.5665, 126.9780] : [35.1796, 129.0756];
  dayMap = L.map(container, {
    center: defaultCenter,
    zoom: 13,
    zoomControl: false,
    attributionControl: true,
    scrollWheelZoom: false,
    tap: true
  });
  tiles(dayMap);

  const g = L.featureGroup().addTo(dayMap), col = DAYCOLOR[d.id] || '#b4442a';
  const pts = []; let n = 0;
  d.items.forEach(it => {
    const p = PL[it.p]; if (!p) return;
    if (p.c !== d.city && !it.mv) return;
    if (it.mv){
      if (p.c === d.city && d.id !== 'd4') {
        L.marker(p.ll, {icon:numIcon('🚆', '#4f6b4a', 26)}).bindPopup(popHTML(it.p)).addTo(g);
        pts.push(p.ll);
      }
      return;
    }
    n++; pts.push(p.ll);
    L.marker(p.ll, {icon: p.food ? foodIcon : numIcon(n, col)}).bindPopup(popHTML(it.p)).addTo(g);
  });

  if (d.id === 'd4'){
    const s = PL.seoulst;
    if (s) L.marker(s.ll, {icon:numIcon('🚆','#4f6b4a',26)}).bindPopup(popHTML('seoulst')).addTo(g);
  }

  const cityPts = pts.filter(ll => (d.id === 'd4') ? ll[0] > 36 : true);
  if (cityPts.length > 1) {
    L.polyline(cityPts, {color:col, weight:3, opacity:.7, dashArray:'6 6'}).addTo(dayMap);
  }

  ZONES.filter(z => z.c === d.city && z.rec === '首选').forEach(z => {
    L.circle(z.ll, {radius:z.r, color:'#b4442a', weight:1, fillColor:'#b4442a', fillOpacity:.08}).bindPopup(zonePop(z)).addTo(g);
  });

  if (d.id === 'd4') {
    ZONES.filter(z => z.id === 'z_md').forEach(z => L.circle(z.ll, {radius:z.r, color:'#b4442a', weight:1, fillOpacity:.08}).addTo(g));
  }

  L.control.zoom({position:'topright'}).addTo(dayMap);

  const fitBoundsSafe = () => {
    if (!dayMap) return;
    try {
      if (d.id === 'd4') {
        const layers = g.getLayers().filter(l => l.getLatLng && l.getLatLng().lat > 36).map(l => l.getLatLng());
        if (layers.length > 0) {
          const b = L.latLngBounds(layers);
          if (b.isValid()) dayMap.fitBounds(b.pad(0.15));
        }
      } else {
        if (g.getLayers().length > 0) {
          const b = g.getBounds();
          if (b.isValid()) dayMap.fitBounds(b.pad(0.12));
        }
      }
    } catch(e) {}
  };

  fitBoundsSafe();

  const updateSize = () => {
    if (dayMap && container.clientWidth > 0 && container.clientHeight > 0) {
      dayMap.invalidateSize();
      fitBoundsSafe();
    }
  };

  if (window.ResizeObserver) {
    const ro = new ResizeObserver(() => {
      if (container.clientWidth > 0) {
        updateSize();
        ro.disconnect();
      }
    });
    ro.observe(container);
  }
  requestAnimationFrame(updateSize);
  setTimeout(updateSize, 120);
  setTimeout(updateSize, 400);
}

/* swipe between days */
(function(){
  let x0 = null, y0 = null, t0 = 0;
  const el = $('#v-days');
  el.addEventListener('touchstart', e => {
    if (e.target.closest('.leaflet-container, .chiprow')) { x0 = null; return; }
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; t0 = Date.now();
  }, {passive:true});
  el.addEventListener('touchend', e => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
    if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.8 && Date.now() - t0 < 600){
      const i = DAYS.findIndex(d => d.id === curDay), j = i + (dx < 0 ? 1 : -1);
      if (DAYS[j]) location.hash = 'days/' + DAYS[j].id;
    }
    x0 = null;
  }, {passive:true});
})();

let bigMap, bigLayers = {}, mapCity = 'seoul', mapFilter = 'all';
const markerIndex = {};
function initBigMap(){
  if (bigMap || !window.L) return;
  const container = document.getElementById('bigMap');
  if (!container) return;
  container._leaflet_id = null;
  bigMap = L.map(container, {zoomControl:false});
  tiles(bigMap);
  L.control.zoom({position:'topright'}).addTo(bigMap);
  // per-day layers
  DAYS.forEach(d => {
    const g = L.featureGroup(); const col = DAYCOLOR[d.id]; let n = 0; const pts = [];
    d.items.forEach(it => {
      const p = PL[it.p]; if (!p || it.mv || p.food) { if (p && p.food){ n++; pts.push(p.ll);} return; }
      n++; pts.push(p.ll);
      const m = L.marker(p.ll, {icon:numIcon(n, col)}).bindPopup(popHTML(it.p)).addTo(g);
      markerIndex[it.p] = markerIndex[it.p] || m;
    });
    const seg = pts.filter(ll => (ll[0] > 36) === (d.city === 'seoul'));
    if (d.id === 'd4'){ L.polyline(pts.filter(ll => ll[0] > 36), {color:col, weight:3, opacity:.7, dashArray:'6 6'}).addTo(g); L.polyline(pts.filter(ll => ll[0] < 36), {color:col, weight:3, opacity:.7, dashArray:'6 6'}).addTo(g); }
    else if (seg.length > 1) L.polyline(seg, {color:col, weight:3, opacity:.7, dashArray:'6 6'}).addTo(g);
    bigLayers[d.id] = g;
  });
  // extra spots (not in itinerary)
  const ex = L.featureGroup();
  Object.entries(PL).forEach(([k, p]) => {
    if (p.food || markerIndex[k] || placeDays(k).length) return;
    const m = L.marker(p.ll, {icon:numIcon('·', '#a39282', 16)}).bindPopup(popHTML(k)).addTo(ex);
    markerIndex[k] = m;
  });
  bigLayers.extra = ex;
  // food
  const fg = L.featureGroup();
  Object.entries(PL).forEach(([k, p]) => { if (!p.food) return; const m = L.marker(p.ll, {icon:foodIcon}).bindPopup(popHTML(k)).addTo(fg); markerIndex[k] = markerIndex[k] || m; });
  bigLayers.food = fg;
  // zones
  const zg = L.featureGroup();
  ZONES.forEach(z => {
    const main = z.rec === '首选';
    L.circle(z.ll, {radius:z.r, color: main ? '#b4442a' : '#8a7a6c', weight: main ? 2 : 1, dashArray: main ? null : '4 4', fillColor: main ? '#b4442a' : '#8a7a6c', fillOpacity: main ? .12 : .06})
      .bindPopup(zonePop(z)).addTo(zg);
    L.marker(z.ll, {icon:L.divIcon({className:'', html:`<span class="zone-label">🏨 ${z.name}${main ? ' ★' : ''}</span>`, iconSize:null})}).bindPopup(zonePop(z)).addTo(zg);
  });
  bigLayers.zones = zg;

  $('#mapChips').innerHTML = [['all','全部'],...DAYS.map(d => [d.id, `${d.id.toUpperCase()} ${d.md}`]),['zones','🏨 住宿区'],['food','🍜 餐厅']]
    .map(([k, t]) => `<button type="button" class="chip sm" data-f="${k}" aria-pressed="${k==='all'}">${t}</button>`).join('');
  $('#legend').innerHTML = DAYS.map(d => `<span><i style="background:${DAYCOLOR[d.id]}"></i>${d.id.toUpperCase()}</span>`).join('') +
    '<span>🍜 餐厅</span><span><i style="background:#b4442a;opacity:.4"></i>推荐住宿区</span><span><i style="background:#a39282"></i>备选景点</span>';
  applyMap();
}
function applyMap(fit = true){
  Object.values(bigLayers).forEach(l => bigMap.removeLayer(l));
  const show = [];
  if (mapFilter === 'all') show.push(...DAYS.map(d => d.id), 'zones', 'food', 'extra');
  else if (mapFilter === 'zones') show.push('zones');
  else if (mapFilter === 'food') show.push('food');
  else show.push(mapFilter, 'zones');
  show.forEach(k => bigLayers[k].addTo(bigMap));
  $$('#mapChips [data-f]').forEach(b => b.setAttribute('aria-pressed', b.dataset.f === mapFilter));
  $$('#citySeg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.city === mapCity));
  if (fit){
    const lls = [];
    show.forEach(k => bigLayers[k].eachLayer(l => { if (l.getLatLng){ const ll = l.getLatLng(); if ((ll.lat > 36) === (mapCity === 'seoul')) lls.push(ll); } }));
    if (lls.length) bigMap.fitBounds(L.latLngBounds(lls).pad(0.1));
  }
  renderZones();
}
$('#mapChips').addEventListener('click', e => {
  const b = e.target.closest('[data-f]'); if (!b) return;
  mapFilter = b.dataset.f;
  const d = dayOf(mapFilter); if (d) mapCity = d.city;
  applyMap();
});
$('#citySeg').addEventListener('click', e => {

    <h3>${x.n} <span class="small muted" style="font-weight:400">${x.ko}</span></h3><p>${x.d}</p><div class="meta">${cityTag(x.c)}</div></div></article>`).join('');
}

function setupChecks(){
  const KEY = 'kr-autumn-2026-pack';
  let saved = {}; try { saved = JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){}
  const all = $$('#prepPanel input[type=checkbox]'), pack = $$('#packList input');
  const upd = () => {
    const n = pack.filter(b => b.checked).length;
    const total = pack.length || 1;
    if ($('#packBar')) $('#packBar').style.width = Math.round(n / total * 100) + '%';
    if ($('#packTxt')) $('#packTxt').textContent = n + '/' + pack.length;
  };
  all.forEach(b => {
    b.checked = b.dataset.id in saved ? !!saved[b.dataset.id] : !!b.dataset.def;
    b.addEventListener('change', () => { saved[b.dataset.id] = b.checked; try { localStorage.setItem(KEY, JSON.stringify(saved)); } catch(e){} upd(); });
  });
  const resetBtn = $('#packReset');
  if (resetBtn) {
    resetBtn.addEventListener('click', () => {
      pack.forEach(b => { b.checked = false; saved[b.dataset.id] = false; });
      try { localStorage.setItem(KEY, JSON.stringify(saved)); } catch(e){}
      upd();
    });
  }
  upd();
}

  $('#lbImg').src = im.src; $('#lbImg').alt = im.alt; $('#lbCap').textContent = im.dataset.cap || '';
